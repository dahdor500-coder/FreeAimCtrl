name: Build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: git clone --depth 1 https://github.com/RusJJ/AndroidModLoader.git aml
      - run: cp -r aml/mod jni/mod
      - run: $ANDROID_NDK_LATEST_HOME/ndk-build
      - uses: actions/upload-artifact@v4
        with:
          name: libFreeAimCtrl
          path: libs/arm64-v8a/libFreeAimCtrl.so
